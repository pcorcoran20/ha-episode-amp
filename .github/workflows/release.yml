name: Release

# Publishes a GitHub release (and its v* tag) whenever main has a manifest
# version that hasn't been released yet. Bump the version to ship an update.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create release if version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version custom_components/episode_amp/manifest.json)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already released, nothing to do"
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
